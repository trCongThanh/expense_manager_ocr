name: expense_manager_ocr
description: Quản Lý Chi Tiêu OCR Hóa Đơn - Flutter (ML Kit).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # OCR & Quét ảnh
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  image_cropper: ^7.1.0

  # Giao diện & Biểu đồ
  fl_chart: ^0.68.0
  lucide_icons_flutter: ^3.1.24

  # Hiệu ứng chuyển động
  lottie: ^3.1.2
  animations: ^2.0.11
  flutter_animate: ^4.5.0

  # Tính toán & Định dạng
  intl: ^0.19.0

  # Lưu trữ & State
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  
  # UI/UX Additions
  shimmer: ^3.0.0
  skeletonizer: ^3.0.0
  sliding_up_panel: ^2.0.0+1
  
  # Security
  local_auth: ^2.2.0
  
  # Utility
  uuid: ^4.4.0
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
